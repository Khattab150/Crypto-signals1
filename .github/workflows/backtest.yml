name: backtest
on:
  workflow_dispatch:
    inputs:
      coins:
        description: 'عدد العملات'
        default: '40'
      tf:
        description: 'الفريمات'
        default: '15m,30m,1h,4h,1d'
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python backtest.py --coins "${{ github.event.inputs.coins }}" --tf "${{ github.event.inputs.tf }}" --telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
