name: crypto-signals
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'رسالة تجربة فقط'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: signals
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: test message
        if: ${{ github.event.inputs.test == 'true' }}
        run: python bot.py --test
      - name: run bot
        if: ${{ github.event.inputs.test != 'true' }}
        run: python bot.py
      - name: save state
        if: ${{ github.event.inputs.test != 'true' }}
        run: |
          git config user.name "signals-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "state" && git push)
